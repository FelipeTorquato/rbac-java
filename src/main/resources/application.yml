spring:
  application:
    name: rbac

  datasource:
    url: jdbc:postgresql://localhost:5432/rbac_db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  web:
    error:
      include-message: never
      include-binding-errors: never
      include-stacktrace: never

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s

jwt:
  secret: 0kbkeYHbuGvgNGRo12POe8jJHKAD8HIau1ZhyndfZ89
  issuer: ${JWT_ISSUER:rbac-service}
  expiration: ${JWT_EXPIRATION_MS:900000}


security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}